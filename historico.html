<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Histórico & Estatísticas - BR Deprê</title>
    <link rel="icon" href="./bdd.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3B82F6;
            --primary-dark: #2563EB;
            --primary-glow: rgba(59, 130, 246, 0.3);
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --dark-bg: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.9);
            --card-border: rgba(59, 130, 246, 0.2);
            --text-primary: #F1F5F9;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
            color: var(--text-primary);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header h1 {
            font-size: 1.75rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header h1 i {
            color: var(--primary);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            border-radius: 2rem;
            padding: 0.6rem 1.25rem;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .back-btn:hover {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Tabs de Navegação */
        .main-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            border-radius: 1rem;
            padding: 0.5rem;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            flex: 1;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            border-radius: 0.75rem;
            color: var(--text-secondary);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        /* Carrossel de Rodadas */
        .rounds-navigation-container {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 0.5rem;
            border-radius: 1rem;
            border: 1px solid var(--card-border);
        }

        .rounds-scroll-container {
            flex-grow: 1;
            overflow-x: auto;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }
        .rounds-scroll-container::-webkit-scrollbar { display: none; }

        .rounds-tabs { display: inline-flex; gap: 0.5rem; }
        .round-tab {
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            border-radius: 0.6rem;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            white-space: nowrap;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
        }

        .round-tab:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .round-tab.active {
            background: var(--primary);
            color: white;
        }

        .nav-button {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin: 0 4px;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .nav-button:hover:not(.disabled) {
            background: var(--primary);
            color: white;
        }

        .nav-button.disabled { opacity: 0.4; cursor: not-allowed; }

        /* Cards de Jogos */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.25rem;
        }

        .match-card {
            background: var(--card-bg);
            border-radius: 1rem;
            border: 1px solid var(--card-border);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
        }

        .match-teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .team {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .team-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .team-name {
            font-weight: 600;
            font-size: 0.85rem;
            text-align: center;
        }

        .match-result {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            padding: 0 1rem;
        }

        .match-footer {
            border-top: 1px solid var(--card-border);
            padding-top: 0.75rem;
            text-align: center;
        }

        .btn-view-predictions {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid var(--card-border);
            color: var(--primary);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-view-predictions:hover {
            background: var(--primary);
            color: white;
        }

        /* Seção Comparativa (Player vs Player) */
        .comparison-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .selectors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--card-border);
            border-radius: 0.5rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        .form-select option {
            background: #0F172A;
            color: var(--text-primary);
        }

        .comparison-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .metric-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 0.75rem;
            padding: 1rem;
            text-align: center;
        }

        .metric-title {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-values {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-size: 1.25rem;
            font-weight: 800;
        }

        .chart-container {
            position: relative;
            height: 320px;
            width: 100%;
            margin-top: 1rem;
        }

        /* Diálogo de Palpites */
        dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0F172A;
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            color: var(--text-primary);
            width: 90%;
            max-width: 500px;
            padding: 0;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        dialog::backdrop {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(4px);
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }

        .dialog-content {
            padding: 1.5rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .prediction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-chart-bar"></i> Histórico & Estatísticas</h1>
            <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Voltar</a>
        </div>

        <!-- Abas Principais -->
        <div class="main-tabs">
            <button id="tab-rounds" class="tab-btn active"><i class="fas fa-calendar-alt"></i> Por Rodada</button>
            <button id="tab-player-round" class="tab-btn"><i class="fas fa-user-clock"></i> Jogador/Rodada</button>
            <button id="tab-comparison" class="tab-btn"><i class="fas fa-swords"></i> Comparativo (P1 vs P2)</button>
            <button id="tab-stats" class="tab-btn"><i class="fas fa-pie-chart"></i> Stats & Gráficos</button>
        </div>

        <!-- Conteúdo 1: Por Rodada -->
        <div id="content-rounds" class="tab-content">
            <div class="rounds-navigation-container">
                <button class="nav-button" id="prev-round-btn"><i class="fas fa-chevron-left"></i></button>
                <div class="rounds-scroll-container">
                    <div class="rounds-tabs" id="rounds-tabs"></div>
                </div>
                <button class="nav-button" id="next-round-btn"><i class="fas fa-chevron-right"></i></button>
            </div>

            <div id="matches-container" class="matches-grid"></div>
        </div>

        <!-- Conteudo extra: Palpites de um jogador em uma rodada -->
        <div id="content-player-round" class="tab-content" style="display: none;">
            <div class="comparison-panel">
                <div class="selectors-grid">
                    <div class="form-group">
                        <label><i class="fas fa-user" style="color: #3B82F6;"></i> Jogador:</label>
                        <select id="player-round-user-select" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-alt" style="color: #F59E0B;"></i> Rodada:</label>
                        <select id="player-round-round-select" class="form-select"></select>
                    </div>
                </div>
                <div id="player-round-predictions" class="matches-grid"></div>
            </div>
        </div>

        <!-- Conteúdo 2: Comparativo Directo -->
        <div id="content-comparison" class="tab-content" style="display: none;">
            <div class="comparison-panel">
                <div class="selectors-grid">
                    <div class="form-group">
                        <label><i class="fas fa-user" style="color: #3B82F6;"></i> Jogador 1:</label>
                        <select id="p1-select" class="form-select"></select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user" style="color: #EC4899;"></i> Jogador 2:</label>
                        <select id="p2-select" class="form-select"></select>
                    </div>
                </div>

                <!-- Métricas Comparativas -->
                <div class="comparison-metrics" id="comparison-metrics-container"></div>

                <!-- Gráfico de Evolução -->
                <h3 style="font-size: 1.1rem; color: #f59e0b; margin-top: 1.5rem; margin-bottom: 0.5rem;">
                    <i class="fas fa-line-chart"></i> Evolução de Pontos por Rodada
                </h3>
                <div class="chart-container">
                    <canvas id="comparison-line-chart"></canvas>
                </div>
            </div>
        </div>

        <!-- Conteúdo 3: Stats & Gráficos -->
        <div id="content-stats" class="tab-content" style="display: none;">
            <div class="comparison-panel">
                <div class="form-group" style="max-width: 300px; margin-bottom: 1.5rem;">
                    <label><i class="fas fa-filter"></i> Filtrar Estatísticas por Jogador:</label>
                    <select id="stats-player-select" class="form-select">
                        <option value="all">Geral (Todos os Palpiteiros)</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem;">
                    <div>
                        <h4 style="color: var(--text-secondary); margin-bottom: 1rem; text-align: center;">
                            <i class="fas fa-bullseye"></i> Distribuição de Palpites
                        </h4>
                        <div class="chart-container" style="height: 260px;">
                            <canvas id="accuracy-doughnut-chart"></canvas>
                        </div>
                    </div>
                    <div>
                        <h4 style="color: var(--text-secondary); margin-bottom: 1rem; text-align: center;">
                            <i class="fas fa-shield-alt"></i> Times Que Mais Geraram Pontos
                        </h4>
                        <div class="chart-container" style="height: 260px;">
                            <canvas id="teams-bar-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="no-rounds-message" class="empty-state" style="display: none;">
            <p>Nenhuma rodada concluída encontrada no histórico.</p>
        </div>
    </div>

    <!-- DIÁLOGO DE PALPITES DO JOGO -->
    <dialog id="predictions-dialog">
        <div class="dialog-header">
            <h2 id="dialog-title" style="font-size: 1.1rem;"><i class="fas fa-eye"></i> Palpites do Jogo</h2>
            <button class="close-btn">×</button>
        </div>
        <div class="dialog-content">
            <div id="predictions-list"></div>
        </div>
    </dialog>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBBrIiwL2sUVEPc8YBzdkJxPVyVVC5QN1M",
            authDomain: "brdepre.firebaseapp.com",
            databaseURL: "https://brdepre-default-rtdb.firebaseio.com",
            projectId: "brdepre",
            storageBucket: "brdepre.firebasestorage.app",
            messagingSenderId: "1077826896098",
            appId: "1:1077826896098:web:abe2b07a280a4852649ebb",
            measurementId: "G-4JXFEZ8DW6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const database = firebase.database();

        let teamsCache = {};
        let usersCache = {};
        let allCompletedRounds = [];
        let comparisonChartInstance = null;
        let accuracyChartInstance = null;
        let teamsChartInstance = null;

        const ui = {
            roundsTabs: document.getElementById('rounds-tabs'),
            matchesContainer: document.getElementById('matches-container'),
            noRoundsMessage: document.getElementById('no-rounds-message'),
            dialog: document.getElementById('predictions-dialog'),
            dialogTitle: document.getElementById('dialog-title'),
            dialogList: document.getElementById('predictions-list'),
            dialogCloseBtn: document.querySelector('#predictions-dialog .close-btn'),
            prevRoundBtn: document.getElementById('prev-round-btn'),
            nextRoundBtn: document.getElementById('next-round-btn'),
            roundsScrollContainer: document.querySelector('.rounds-scroll-container'),
            p1Select: document.getElementById('p1-select'),
            p2Select: document.getElementById('p2-select'),
            statsPlayerSelect: document.getElementById('stats-player-select'),
            playerRoundUserSelect: document.getElementById('player-round-user-select'),
            playerRoundRoundSelect: document.getElementById('player-round-round-select'),
            playerRoundPredictions: document.getElementById('player-round-predictions')
        };

        auth.onAuthStateChanged((user) => {
            if (user) initializeApp();
            else window.location.href = 'index.html';
        });

        async function initializeApp() {
            try {
                await Promise.all([loadTeams(), loadUsers()]);
                await loadCompletedRounds();
                setupTabsAndEventListeners();
                populatePlayerSelectors();
            } catch (error) {
                console.error("Erro na inicialização do histórico:", error);
            }
        }

        async function loadTeams() {
            const snapshot = await database.ref('teams').once('value');
            teamsCache = snapshot.val() || {};
        }

        async function loadUsers() {
            const snapshot = await database.ref('users').once('value');
            usersCache = snapshot.val() || {};
        }

        async function loadCompletedRounds() {
            const roundsSnapshot = await database.ref('rounds').orderByChild('status').equalTo(2).once('value');
            if (!roundsSnapshot.exists()) {
                ui.noRoundsMessage.style.display = 'block';
                return;
            }

            allCompletedRounds = [];
            roundsSnapshot.forEach(rSnap => {
                allCompletedRounds.push({ id: rSnap.key, ...rSnap.val() });
            });

            allCompletedRounds.sort((a, b) => (a.finishTimestamp || 0) - (b.finishTimestamp || 0));

            ui.roundsTabs.innerHTML = allCompletedRounds.map((round, index) => 
                `<div class="round-tab" data-round-id="${round.id}">Rodada ${index + 1}</div>`
            ).join('');

            const roundTabs = document.querySelectorAll('.round-tab');
            roundTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    roundTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    loadRoundDetails(tab.dataset.roundId);
                });
            });

            if (allCompletedRounds.length > 0) {
                roundTabs[roundTabs.length - 1].click();
                setTimeout(() => {
                    roundTabs[roundTabs.length - 1].scrollIntoView({ behavior: 'smooth', inline: 'center' });
                }, 100);
            }
        }

        async function loadRoundDetails(roundId) {
            ui.matchesContainer.innerHTML = '<p class="empty-state">Carregando jogos...</p>';
            const roundData = allCompletedRounds.find(r => r.id === roundId) || {};
            const matches = roundData.matches || [];
            const starPlayers = roundData.starPlayers || {};
            const playerGoals = roundData.playerGoals || {};

            if (!matches.length) {
                ui.matchesContainer.innerHTML = '<p class="empty-state">Nenhum jogo encontrado para esta rodada.</p>';
                return;
            }

            let starPlayersHtml = '';
            if (Object.keys(starPlayers).length > 0) {
                starPlayersHtml = `
                    <div style="grid-column: 1 / -1; background: var(--card-bg); padding: 1.25rem; border-radius: 1rem; border: 1px dashed rgba(245, 158, 11, 0.4); margin-bottom: 1.25rem;">
                        <h3 style="font-size: 1.05rem; color: #f59e0b; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fas fa-running"></i> Artilheiros da Rodada Escolhidos (+1 pt por gol)
                        </h3>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 0.75rem;">
                            ${Object.entries(starPlayers).map(([uid, sp]) => {
                                const user = usersCache[uid] || { name: 'Desconhecido' };
                                const goalsInfo = playerGoals[sp.athleteId] || 0;
                                const goalsCount = typeof goalsInfo === 'number' ? goalsInfo : (goalsInfo.count || 0);
                                return `
                                    <div style="background: rgba(15, 23, 42, 0.6); padding: 0.65rem 0.85rem; border-radius: 0.5rem; border: 1px solid var(--card-border); font-size: 0.85rem;">
                                        <div><strong>${user.name}</strong></div>
                                        <div style="color: var(--text-secondary); font-size: 0.8rem; margin-top: 2px;">⚽ ${sp.athleteName} (${sp.teamName || ''})</div>
                                        <div style="font-weight: 700; color: ${goalsCount > 0 ? 'var(--success)' : '#f59e0b'}; margin-top: 4px;">
                                            ${goalsCount} gol(s) = +${goalsCount} pts
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            const matchesHtml = matches.map((match, index) => {
                const homeTeam = teamsCache[match.homeTeam] || {};
                const awayTeam = teamsCache[match.awayTeam] || {};
                return `
                    <div class="match-card">
                        <div class="match-teams">
                            <div class="team">
                                <img src="${homeTeam.image || ''}" alt="${homeTeam.name}" class="team-logo">
                                <span class="team-name">${homeTeam.name}</span>
                            </div>
                            <div class="match-result">${match.finalResult?.homeScore ?? '-'} : ${match.finalResult?.awayScore ?? '-'}</div>
                            <div class="team">
                                <img src="${awayTeam.image || ''}" alt="${awayTeam.name}" class="team-logo">
                                <span class="team-name">${awayTeam.name}</span>
                            </div>
                        </div>
                        <div class="match-footer">
                            <button class="btn-view-predictions" data-round-id="${roundId}" data-match-id="${index}">
                                <i class="fas fa-eye"></i> Ver Palpites
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            ui.matchesContainer.innerHTML = starPlayersHtml + matchesHtml;

            document.querySelectorAll('.btn-view-predictions').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const { roundId, matchId } = e.currentTarget.dataset;
                    showPredictionsForMatch(roundId, matchId);
                });
            });
        }

        function calculateMatchPoints(final, pred) {
            if (!final || final.homeScore === undefined || !pred || pred.homeScore === undefined) return null;
            let pts = 0;
            if (final.homeScore === pred.homeScore && final.awayScore === pred.awayScore) pts = 3;
            else {
                const finalW = Math.sign(final.homeScore - final.awayScore);
                const predW = Math.sign(pred.homeScore - pred.awayScore);
                if (finalW === predW) pts = 1;
                else if (final.homeScore === pred.awayScore && final.awayScore === pred.homeScore) pts = -1;
                else pts = 0;
            }
            if (pred.isStarMatch || pred.isCaptain || pred.star || pred.doublePoints) {
                pts *= 2;
            }
            return pts;
        }

        function showPredictionsForMatch(roundId, matchId) {
            const roundData = allCompletedRounds.find(r => r.id === roundId);
            const match = roundData?.matches?.[matchId];
            if (!match) return;

            const homeTeam = teamsCache[match.homeTeam]?.name || "Time A";
            const awayTeam = teamsCache[match.awayTeam]?.name || "Time B";
            ui.dialogTitle.innerHTML = `<i class="fas fa-eye"></i> ${homeTeam} vs ${awayTeam}`;
            
            const predictions = match.predictions || {};
            let predictionsArray = Object.entries(predictions).map(([playerId, prediction]) => {
                const player = usersCache[playerId] || { name: "Desconhecido" };
                const points = calculateMatchPoints(match.finalResult, prediction);
                return { ...player, ...prediction, points };
            });

            predictionsArray.sort((a, b) => (b.points ?? -99) - (a.points ?? -99) || a.name.localeCompare(b.name));

            ui.dialogList.innerHTML = predictionsArray.map(p => {
                const starTag = p.isStarMatch ? '<span style="color:#f59e0b; font-size:12px; font-weight:bold; margin-left:4px;">⭐ 2x</span>' : '';
                return `
                    <div class="prediction-item">
                        <span style="font-weight: 500;">${p.name} ${starTag}</span>
                        <span style="font-weight: 700; font-size: 1.1rem; color: var(--primary);">${p.homeScore} × ${p.awayScore}</span>
                        <span style="font-weight: 800; font-size: 1rem; color: ${p.points > 0 ? 'var(--success)' : p.points < 0 ? 'var(--danger)' : 'var(--text-muted)'};">
                            ${p.points !== null ? `${p.points > 0 ? '+' : ''}${p.points} pts` : '-'}
                        </span>
                    </div>
                `;
            }).join('') || '<div class="empty-state">Nenhum palpite para este jogo.</div>';
            
            ui.dialog.showModal();
        }

        function populatePlayerSelectors() {
            const userEntries = Object.entries(usersCache).sort((a, b) => (a[1].name || '').localeCompare(b[1].name || ''));
            const optionsHtml = userEntries.map(([uid, u]) => `<option value="${uid}">${u.name || uid}</option>`).join('');

            ui.p1Select.innerHTML = optionsHtml;
            ui.p2Select.innerHTML = optionsHtml;
            ui.statsPlayerSelect.innerHTML = '<option value="all">Geral (Todos os Palpiteiros)</option>' + optionsHtml;
            if (ui.playerRoundUserSelect) ui.playerRoundUserSelect.innerHTML = optionsHtml;
            if (ui.playerRoundRoundSelect) {
                ui.playerRoundRoundSelect.innerHTML = allCompletedRounds.map((round, index) =>
                    `<option value="${round.id}">Rodada ${index + 1}</option>`
                ).join('');
                if (allCompletedRounds.length) ui.playerRoundRoundSelect.value = allCompletedRounds[allCompletedRounds.length - 1].id;
            }

            if (userEntries.length > 1) {
                ui.p2Select.selectedIndex = 1;
            }

            ui.p1Select.onchange = updateComparison;
            ui.p2Select.onchange = updateComparison;
            ui.statsPlayerSelect.onchange = updateGeneralStats;
            if (ui.playerRoundUserSelect) ui.playerRoundUserSelect.onchange = updatePlayerRoundPredictions;
            if (ui.playerRoundRoundSelect) ui.playerRoundRoundSelect.onchange = updatePlayerRoundPredictions;

            updateComparison();
            updateGeneralStats();
            updatePlayerRoundPredictions();
        }

        function updatePlayerRoundPredictions() {
            if (!ui.playerRoundUserSelect || !ui.playerRoundRoundSelect || !ui.playerRoundPredictions) return;
            const userId = ui.playerRoundUserSelect.value;
            const roundId = ui.playerRoundRoundSelect.value;
            const roundData = allCompletedRounds.find(r => r.id === roundId);
            const user = usersCache[userId] || {};

            if (!roundData || !userId) {
                ui.playerRoundPredictions.innerHTML = '<p class="empty-state">Selecione um jogador e uma rodada.</p>';
                return;
            }

            const matches = Array.isArray(roundData.matches) ? roundData.matches : Object.values(roundData.matches || {});
            const playerItems = matches.map(match => {
                const pred = match.predictions?.[userId];
                const homeTeam = teamsCache[match.homeTeam]?.name || match.homeTeamName || match.homeTeam || 'Mandante';
                const awayTeam = teamsCache[match.awayTeam]?.name || match.awayTeamName || match.awayTeam || 'Visitante';
                const result = match.finalResult ? `${match.finalResult.homeScore} x ${match.finalResult.awayScore}` : '-';
                const points = pred ? calculateMatchPoints(match.finalResult, pred) : null;
                const starTag = pred && (pred.isStarMatch || pred.isCaptain || pred.star || pred.doublePoints)
                    ? '<span style="color:#f59e0b; font-size:12px; font-weight:bold; margin-left:4px;">⭐ 2x</span>'
                    : '';

                return `
                    <div class="match-card">
                        <div class="match-teams">
                            <div class="team"><span class="team-name">${homeTeam}</span></div>
                            <div class="match-result">${result}</div>
                            <div class="team"><span class="team-name">${awayTeam}</span></div>
                        </div>
                        <div class="match-footer" style="justify-content: space-between; gap: 1rem; flex-wrap: wrap;">
                            <span><strong>${user.name || 'Jogador'}:</strong> ${pred ? `${pred.homeScore} x ${pred.awayScore}${starTag}` : 'Sem palpite'}</span>
                            <span style="font-weight: 800; color: ${points > 0 ? 'var(--success)' : points < 0 ? 'var(--danger)' : 'var(--text-muted)'};">
                                ${points !== null ? `${points > 0 ? '+' : ''}${points} pts` : '-'}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            const starPlayer = roundData.starPlayers?.[userId];
            const goalsInfo = starPlayer ? (roundData.playerGoals?.[starPlayer.athleteId] || 0) : 0;
            const goalsCount = typeof goalsInfo === 'number' ? goalsInfo : (goalsInfo.count || 0);
            const starHtml = starPlayer ? `
                <div style="grid-column: 1 / -1; background: var(--card-bg); padding: 1rem; border-radius: 1rem; border: 1px dashed rgba(245, 158, 11, 0.4);">
                    <strong style="color:#f59e0b;">Artilheiro:</strong> ${starPlayer.athleteName || starPlayer.name || 'Atleta'} (${starPlayer.teamName || ''}) - ${goalsCount} gol(s), +${goalsCount} pts
                </div>
            ` : '';

            ui.playerRoundPredictions.innerHTML = starHtml + (playerItems || '<p class="empty-state">Nenhum jogo encontrado para esta rodada.</p>');
        }

        function updateComparison() {
            const p1Uid = ui.p1Select.value;
            const p2Uid = ui.p2Select.value;
            if (!p1Uid || !p2Uid) return;

            const p1Name = usersCache[p1Uid]?.name || 'P1';
            const p2Name = usersCache[p2Uid]?.name || 'P2';

            const roundLabels = [];
            const p1Scores = [];
            const p2Scores = [];

            let p1Total = 0, p2Total = 0;
            let p1Exacts = 0, p2Exacts = 0;
            let p1RoundsWon = 0, p2RoundsWon = 0;

            allCompletedRounds.forEach((round, rIdx) => {
                roundLabels.push(`R${rIdx + 1}`);

                let p1RoundPts = 0;
                let p2RoundPts = 0;

                (round.matches || []).forEach(m => {
                    if (m.finalResult && m.predictions) {
                        if (m.predictions[p1Uid]) {
                            const pts1 = calculateMatchPoints(m.finalResult, m.predictions[p1Uid]) || 0;
                            p1RoundPts += pts1;
                            if (pts1 >= 3) p1Exacts++;
                        }
                        if (m.predictions[p2Uid]) {
                            const pts2 = calculateMatchPoints(m.finalResult, m.predictions[p2Uid]) || 0;
                            p2RoundPts += pts2;
                            if (pts2 >= 3) p2Exacts++;
                        }
                    }
                });

                // Artilheiro
                const sp1 = round.starPlayers?.[p1Uid];
                if (sp1 && round.playerGoals?.[sp1.athleteId]) {
                    const g = round.playerGoals[sp1.athleteId].count || round.playerGoals[sp1.athleteId] || 0;
                    p1RoundPts += g;
                }

                const sp2 = round.starPlayers?.[p2Uid];
                if (sp2 && round.playerGoals?.[sp2.athleteId]) {
                    const g = round.playerGoals[sp2.athleteId].count || round.playerGoals[sp2.athleteId] || 0;
                    p2RoundPts += g;
                }

                p1Total += p1RoundPts;
                p2Total += p2RoundPts;

                if (p1RoundPts > p2RoundPts) p1RoundsWon++;
                else if (p2RoundPts > p1RoundPts) p2RoundsWon++;

                p1Scores.push(p1RoundPts);
                p2Scores.push(p2RoundPts);
            });

            // Métricas
            const container = document.getElementById('comparison-metrics-container');
            container.innerHTML = `
                <div class="metric-card">
                    <div class="metric-title">Pontos Totais</div>
                    <div class="metric-values">
                        <span style="color: #3B82F6;">${p1Total}</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">vs</span>
                        <span style="color: #EC4899;">${p2Total}</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Rodadas Vencidas</div>
                    <div class="metric-values">
                        <span style="color: #3B82F6;">${p1RoundsWon}</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">vs</span>
                        <span style="color: #EC4899;">${p2RoundsWon}</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Placares Cravados (3pts)</div>
                    <div class="metric-values">
                        <span style="color: #3B82F6;">${p1Exacts}</span>
                        <span style="font-size: 0.8rem; color: var(--text-muted);">vs</span>
                        <span style="color: #EC4899;">${p2Exacts}</span>
                    </div>
                </div>
            `;

            // Gráfico de Linha
            const ctx = document.getElementById('comparison-line-chart').getContext('2d');
            if (comparisonChartInstance) comparisonChartInstance.destroy();

            comparisonChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: roundLabels,
                    datasets: [
                        {
                            label: p1Name,
                            data: p1Scores,
                            borderColor: '#3B82F6',
                            backgroundColor: 'rgba(59, 130, 246, 0.15)',
                            fill: true,
                            tension: 0.3
                        },
                        {
                            label: p2Name,
                            data: p2Scores,
                            borderColor: '#EC4899',
                            backgroundColor: 'rgba(236, 72, 153, 0.15)',
                            fill: true,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: '#F1F5F9' } }
                    },
                    scales: {
                        x: { ticks: { color: '#94A3B8' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        y: { ticks: { color: '#94A3B8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        function updateGeneralStats() {
            const targetUid = ui.statsPlayerSelect.value;

            let cravados = 0, acertos = 0, erros = 0, invertidos = 0;
            const teamPointsMap = {};

            allCompletedRounds.forEach(round => {
                (round.matches || []).forEach(m => {
                    if (!m.finalResult || !m.predictions) return;

                    const pEntries = targetUid === 'all'
                        ? Object.entries(m.predictions)
                        : (m.predictions[targetUid] ? [[targetUid, m.predictions[targetUid]]] : []);

                    pEntries.forEach(([uid, pred]) => {
                        const pts = calculateMatchPoints(m.finalResult, pred);
                        if (pts >= 3) cravados++;
                        else if (pts >= 1) acertos++;
                        else if (pts === 0) erros++;
                        else if (pts < 0) invertidos++;

                        // Times
                        const hTeam = teamsCache[m.homeTeam]?.name || 'Mandante';
                        const aTeam = teamsCache[m.awayTeam]?.name || 'Visitante';
                        teamPointsMap[hTeam] = (teamPointsMap[hTeam] || 0) + (pts > 0 ? pts : 0);
                        teamPointsMap[aTeam] = (teamPointsMap[aTeam] || 0) + (pts > 0 ? pts : 0);
                    });
                });
            });

            // Gráfico de Rosca (Acurácia)
            const ctxAccuracy = document.getElementById('accuracy-doughnut-chart').getContext('2d');
            if (accuracyChartInstance) accuracyChartInstance.destroy();

            accuracyChartInstance = new Chart(ctxAccuracy, {
                type: 'doughnut',
                data: {
                    labels: ['Cravados (3pts)', 'Vencedor/Empate (1pt)', 'Erros (0pt)', 'Invertidos (-1pt)'],
                    datasets: [{
                        data: [cravados, acertos, erros, invertidos],
                        backgroundColor: ['#10B981', '#F59E0B', '#64748B', '#EF4444']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: '#F1F5F9', boxWidth: 12 } }
                    }
                }
            });

            // Gráfico de Barras (Top Times)
            const topTeams = Object.entries(teamPointsMap)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 6);

            const ctxTeams = document.getElementById('teams-bar-chart').getContext('2d');
            if (teamsChartInstance) teamsChartInstance.destroy();

            teamsChartInstance = new Chart(ctxTeams, {
                type: 'bar',
                data: {
                    labels: topTeams.map(t => t[0]),
                    datasets: [{
                        label: 'Pontos Gerados em Palpites',
                        data: topTeams.map(t => t[1]),
                        backgroundColor: '#3B82F6',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94A3B8' }, grid: { display: false } },
                        y: { ticks: { color: '#94A3B8' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        function setupTabsAndEventListeners() {
            const btnRounds = document.getElementById('tab-rounds');
            const btnPlayerRound = document.getElementById('tab-player-round');
            const btnComp = document.getElementById('tab-comparison');
            const btnStats = document.getElementById('tab-stats');

            const contentRounds = document.getElementById('content-rounds');
            const contentPlayerRound = document.getElementById('content-player-round');
            const contentComp = document.getElementById('content-comparison');
            const contentStats = document.getElementById('content-stats');

            btnRounds.onclick = () => {
                [btnRounds, btnPlayerRound, btnComp, btnStats].forEach(b => b.classList.remove('active'));
                btnRounds.classList.add('active');
                contentRounds.style.display = 'block';
                contentPlayerRound.style.display = 'none';
                contentComp.style.display = 'none';
                contentStats.style.display = 'none';
            };

            btnPlayerRound.onclick = () => {
                [btnRounds, btnPlayerRound, btnComp, btnStats].forEach(b => b.classList.remove('active'));
                btnPlayerRound.classList.add('active');
                contentRounds.style.display = 'none';
                contentPlayerRound.style.display = 'block';
                contentComp.style.display = 'none';
                contentStats.style.display = 'none';
                updatePlayerRoundPredictions();
            };

            btnComp.onclick = () => {
                [btnRounds, btnPlayerRound, btnComp, btnStats].forEach(b => b.classList.remove('active'));
                btnComp.classList.add('active');
                contentRounds.style.display = 'none';
                contentPlayerRound.style.display = 'none';
                contentComp.style.display = 'block';
                contentStats.style.display = 'none';
                updateComparison();
            };

            btnStats.onclick = () => {
                [btnRounds, btnPlayerRound, btnComp, btnStats].forEach(b => b.classList.remove('active'));
                btnStats.classList.add('active');
                contentRounds.style.display = 'none';
                contentPlayerRound.style.display = 'none';
                contentComp.style.display = 'none';
                contentStats.style.display = 'block';
                updateGeneralStats();
            };

            ui.dialogCloseBtn.onclick = () => ui.dialog.close();
            ui.dialog.onclick = e => { if (e.target === ui.dialog) ui.dialog.close(); };

            ui.prevRoundBtn.onclick = () => ui.roundsScrollContainer.scrollBy({ left: -300, behavior: 'smooth' });
            ui.nextRoundBtn.onclick = () => ui.roundsScrollContainer.scrollBy({ left: 300, behavior: 'smooth' });
        }
    </script>
</body>
</html>
